name: CI
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 21 * * *"

defaults:
  run:
    shell: bash

jobs:
  calculate-policy-matrix:
    runs-on: ubuntu-latest
    outputs:
      policy_working_dirs: ${{ steps.calculate-policy-dirs.outputs.policy_working_dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # checkout all history to do git diff
      - name: calculate which policies need a CI job
        id: calculate-policy-dirs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          all_policy_dirs=()
          for makefile in policies/*/Makefile; do
            [ -f "$makefile" ] || continue
            all_policy_dirs+=("${makefile%/Makefile}")
          done
          policies_working_dirs=("${all_policy_dirs[@]}")
          if [ "$EVENT_NAME" == "pull_request" ]; then
            # Include both paths of renames, and let diff errors fail the job.
            git_files="$(git diff --no-color --no-renames --name-only "origin/$BASE_REF...$HEAD_SHA")"
            policies_working_dirs=()
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/*|.github/actions/*|Makefile|policies/Makefile.*|policies/go-common.mk|policies/Cargo.toml|policies/Cargo.lock|policies/go.mod|policies/go.sum|policies/crates/*)
                  # Shared CI and build changes can affect every policy.
                  policies_working_dirs=("${all_policy_dirs[@]}")
                  break
                  ;;
                policies/*/*)
                  policy="${file#policies/}"
                  policy="policies/${policy%%/*}"
                  if [ -f "$policy/Makefile" ]; then
                    policies_working_dirs+=("$policy")
                  fi
                  ;;
              esac
            done <<< "$git_files"
          fi

          declare -p policies_working_dirs # for debug
          policy_working_dirs=$(jq --compact-output --null-input '$ARGS.positional | unique' --args -- "${policies_working_dirs[@]}")
          echo "policy_working_dirs=$policy_working_dirs"
          echo "policy_working_dirs=$policy_working_dirs" >> "$GITHUB_OUTPUT"

  policy-CI:
    name: Policy
    uses: ./.github/workflows/reusable-ci.yaml
    needs: calculate-policy-matrix
    if: ${{ needs.calculate-policy-matrix.outputs.policy_working_dirs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        policy-working-dir: ${{ fromJSON(needs.calculate-policy-matrix.outputs.policy_working_dirs) }}
    with:
      policy-working-dir: ${{ matrix.policy-working-dir }}
